<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>绘漪 — AI 生图</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="绘漪">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <div class="tab-content" id="tabContent">
    <div class="tab-panel active" id="tab-inspire">
      <div class="inspire-header">
        <h1>绘漪</h1>
        <p class="subtitle">轻落笔，涟漪生</p>
        <div class="inspire-search-row">
          <input class="inspire-search" id="searchInput" placeholder="搜索提示词...">
          <button class="clear-btn" id="clearHistory">清空</button>
        </div>
        <div class="inspire-filter-row" id="filterRow">
          <button class="filter-chip active" data-model="all">全部</button>
          <button class="filter-chip" data-model="gpt-image-2">gpt-image-2</button>
          <button class="filter-chip" data-model="gpt-image-2-vip">gpt-image-2-vip</button>
          <button class="filter-chip" data-tab="favs" id="favFilter">收藏</button>
        </div>
      </div>
      <div class="waterfall" id="historyGrid"></div>
      <div class="empty-state" id="emptyState"><p>还没有生成过图片</p></div>
    </div>
    <div class="tab-panel" id="tab-create">
      <div class="create-scroll">
        <h2>创作</h2>
        <textarea id="prompt" placeholder="描述你想生成的图片..." style="width:100%;min-height:100px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text);font-size:14px;resize:none;font-family:inherit"></textarea>
        <div style="display:flex;gap:6px;margin-top:6px">
          <input id="batchCount" type="number" value="1" min="1" max="10" style="width:50px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px;color:var(--text);text-align:center">
          <span style="font-size:12px;color:var(--text2);line-height:32px">张</span>
        </div>
        <input id="negativePrompt" placeholder="不想出现的元素..." style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;color:var(--text);font-size:12px;margin-top:6px;font-family:inherit">
        <div class="ref-grid" id="refImages"></div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button id="refUploadBtn" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:20px;background:var(--surface2);color:var(--text2);cursor:pointer">选择图片</button>
          <button id="refCameraBtn" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:20px;background:var(--surface2);color:var(--text2);cursor:pointer">拍照</button>
        </div>
        <input id="refUrlInput" placeholder="或输入图片URL" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;color:var(--text);font-size:12px;margin-top:6px;font-family:inherit">
        <button id="refUrlAdd" style="padding:6px 12px;border:1px solid var(--border);border-radius:16px;background:var(--surface2);color:var(--text2);cursor:pointer;margin-top:6px">添加URL</button>
        <input id="refInput" type="file" accept="image/*" multiple hidden>
        <div class="ds-card" style="margin-top:8px">
          <div class="ds-header" id="dsToggle">DeepSeek AI <span id="dsArrow">▶</span></div>
          <div class="ds-body" id="dsBody">
            <input id="dsApiKey" placeholder="DS API Key" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:12px;margin-top:6px;font-family:inherit">
            <div style="display:flex;gap:6px;margin-top:6px">
              <button id="dsTranslateBtn" style="flex:1;padding:6px;border:1px solid var(--border);border-radius:16px;background:var(--surface2);color:var(--text2);cursor:pointer">翻译</button>
              <button id="dsEnhanceBtn" style="flex:1;padding:6px;border:1px solid var(--border);border-radius:16px;background:var(--surface2);color:var(--text2);cursor:pointer">增强</button>
              <button id="dsAutoBtn" style="flex:1;padding:6px;border:1px solid var(--border);border-radius:16px;background:var(--surface2);color:var(--text2);cursor:pointer">自动</button>
            </div>
          </div>
        </div>
        <div id="tasksSection" style="display:none;margin-top:8px"><div class="tasks-grid" id="tasksGrid" id="tasksGrid"></div></div>
        <button id="generateBtn" style="width:100%;padding:14px;margin-top:12px;background:linear-gradient(135deg,#7c5cfc,#5a3ed8);border:none;border-radius:28px;color:#fff;font-size:15px;font-weight:700;cursor:pointer">生成图片</button>
      </div>
    </div>
    <div class="tab-panel" id="tab-settings">
      <div class="settings-scroll">
        <h2>我的</h2>
        <div class="settings-card"><label>API Key</label><input id="apiKey" type="password" placeholder="sk-..." autocomplete="off"><button id="keyToggle">显示</button></div>
        <button id="themeBtn" style="padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:var(--surface2);color:var(--text);cursor:pointer">切换主题</button>
        <div id="failedSection" style="display:none"><div class="failed-list" id="failedList"></div><button id="clearFailed">清空失败</button></div>
      </div>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="inspire"><span class="nav-icon">L</span><span>灵感</span></button>
    <button class="nav-item create-tab" data-tab="create"><span class="nav-icon">+</span><span>创作</span></button>
    <button class="nav-item" data-tab="settings"><span class="nav-icon">S</span><span>我的</span></button>
  </nav>
  <div class="viewer-overlay" id="viewer"><button class="viewer-close" id="viewerClose">X</button><img id="viewerImg"><button class="viewer-download" id="viewerDownload">下载</button></div>
  <div class="toast-container" id="toasts"></div>
</div>
<script src="app.js"></script>

<script>
document.querySelectorAll('.nav-item[data-tab]').forEach(function(n) {
  n.addEventListener('click', function() {
    var t = this.dataset.tab;
    document.querySelectorAll('.nav-item').forEach(function(x) { x.classList.remove('active'); });
    this.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(function(p) {
      p.classList.toggle('active', p.id === 'tab-' + t);
    });
  });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() { navigator.serviceWorker.register('/sw.js'); });
}
var dP;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  dP = e;
  setTimeout(function() {
    var b = document.createElement('div');
    b.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#7c5cfc,#5a3ed8);color:#fff;padding:12px 22px;border-radius:24px;font-size:13px;font-weight:600;z-index:2001;cursor:pointer;box-shadow:0 4px 20px rgba(124,92,252,.4);animation:slideUp .4s ease;white-space:nowrap';
    b.textContent = '📲 添加到主屏幕';
    b.addEventListener('click', function() {
      if (dP) { dP.prompt(); dP = null; b.remove(); }
    });
    document.body.appendChild(b);
    setTimeout(function() { b.remove(); }, 10000);
  }, 3000);
});
</script>

</body>
</html>

<!DOCTYPE html><html lang=zh-CN><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>绘漪 - AI 生图</title><link rel=manifest href=/manifest.json><meta name=theme-color content=#0a0a14><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-status-bar-style content=black-translucent><link rel=apple-touch-icon href=/icon-192.png><link rel=icon sizes=192x192 href=/icon-192.png><style>*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a14;--surface:#111122;--surface2:#181830;--surface3:#1e1e3a;--border:#252545;--border2:#333358;--text:#e8e8f4;--text2:#9090b0;--text3:#5c5c78;--accent:#7c5cfc;--accent2:#5a3ed8;--accent-glow:rgba(124,92,252,.15);--success:#34d399;--error:#f87171;--warning:#fbbf24;--info:#60a5fa;--radius:14px;--radius-sm:10px;--font:system-ui,-apple-system,sans-serif;--nav-height:68px;--safe-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=light]{--bg:#f2f2f7;--surface:#fff;--surface2:#f0f0f5;--surface3:#e5e5ea;--border:#dcdce0;--border2:#cfcfd4;--text:#1c1c1e;--text2:#6e6e73;--text3:#aeaeb2;--accent:#6c4de6;--accent2:#5538c4}
[data-theme=sakura]{--bg:#12101f;--surface:#1a172a;--surface2:#221e36;--surface3:#2a2640;--border:#362f52;--border2:#443c62;--text:#ede8f5;--text2:#9b8fb8;--text3:#6b5f88;--accent:#e8829a;--accent2:#d4607a}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;transition:background .3s,color .3s;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
::-webkit-scrollbar{display:none}
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.tab-content{flex:1;overflow:hidden;position:relative}
.tab-panel{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;opacity:0;pointer-events:none;transition:opacity .25s ease;padding-bottom:calc(var(--nav-height) + var(--safe-bottom) + 20px)}
.tab-panel.active{opacity:1;pointer-events:all;z-index:1}
.inspire-header{padding:16px 16px 8px;position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.inspire-header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#7c5cfc,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}.inspire-header .subtitle{font-size:11px;color:var(--text3)}
.inspire-search-row{display:flex;gap:8px;margin-top:12px;align-items:center}
.inspire-search{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:24px;padding:10px 16px;color:var(--text);font-size:13px;outline:none}
.inspire-search:focus{border-color:var(--accent)}
.inspire-filter-row{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:4px;flex-wrap:nowrap}
.inspire-filter-row::-webkit-scrollbar{display:none}
.filter-chip{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--text2);font-size:11px;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0}
.filter-chip.active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.waterfall{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 12px}
.waterfall-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .2s;position:relative}
.waterfall-card:active{transform:scale(.97)}
.waterfall-card .card-img{width:100%;aspect-ratio:1;background:var(--surface2);position:relative;overflow:hidden;cursor:pointer}
.waterfall-card .card-img img{width:100%;height:100%;object-fit:cover;display:block}
.waterfall-card .card-info{padding:10px 12px}
.waterfall-card .card-prompt{font-size:11px;color:var(--text);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.waterfall-card .card-meta{font-size:10px;color:var(--text3);margin-top:6px;display:flex;justify-content:space-between}
.waterfall-card .card-fav{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.4);border:none;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;opacity:0;transition:opacity .2s}
.waterfall-card:active .card-fav{opacity:1}
.waterfall-card .card-fav.faved{opacity:1;color:#fbbf24}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text2);text-align:center}
.empty-state .icon{font-size:56px;margin-bottom:16px;opacity:.4}
.empty-state p{font-size:14px;line-height:1.6}
.create-scroll{padding:16px;display:flex;flex-direction:column;gap:14px}
.create-header{display:flex;align-items:center;justify-content:space-between}
.create-header h2{font-size:20px;font-weight:700}
.create-header .theme-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.prompt-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.prompt-card textarea{width:100%;min-height:120px;background:transparent;border:none;padding:16px;color:var(--text);font-size:15px;line-height:1.6;resize:none;outline:none;font-family:inherit}
.prompt-card textarea::placeholder{color:var(--text3)}
.prompt-card .prompt-footer{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 12px;border-top:1px solid var(--border)}
.prompt-card .char-count{font-size:11px;color:var(--text3)}
.prompt-card .batch-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.prompt-card .batch-row input{width:40px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:4px 6px;color:var(--text);font-size:12px;text-align:center;outline:none}
.neg-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.neg-card .neg-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.neg-card .neg-header .neg-icon{font-size:16px}
.neg-card .neg-header label{font-size:12px;font-weight:600;color:var(--text2)}
.neg-card .neg-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.neg-chip{display:inline-block;padding:4px 10px;font-size:10px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;cursor:pointer;transition:all .15s}
.neg-chip.selected{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.neg-card textarea,.neg-card input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:12px;outline:none;resize:none;min-height:36px;font-family:inherit}
.settings-row{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.settings-row::-webkit-scrollbar{display:none}
.setting-chip{padding:8px 14px;border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--text2);font-size:11px;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;display:flex;align-items:center;gap:4px}
.setting-chip.active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.inspire-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.inspire-card .card-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ref-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.ref-card .ref-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:10px}
.ref-card .ref-grid{display:flex;flex-wrap:wrap;gap:8px}
.ref-img-slot{width:60px;height:60px;border:2px dashed var(--border);border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;flex-shrink:0}
.ref-img-slot img{width:100%;height:100%;object-fit:cover}
.ref-img-slot .add-icon{font-size:22px;color:var(--text2)}
.ref-img-slot .remove-btn{position:absolute;top:1px;right:1px;width:16px;height:16px;background:rgba(0,0,0,.7);border-radius:50%;color:#fff;font-size:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;border:none;opacity:0}
.ref-img-slot:active .remove-btn{opacity:1}
.ref-card .ref-actions{display:flex;gap:6px;margin-top:10px}
.ref-card .ref-actions button{flex:1;padding:8px;border:1px solid var(--border);border-radius:20px;background:var(--surface2);color:var(--text2);font-size:11px;cursor:pointer;transition:all .2s}
.ref-card .ref-actions button:active{border-color:var(--accent);color:var(--accent)}
.ref-card .ref-url-row{display:flex;gap:6px;margin-top:8px}
.ref-card .ref-url-row input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 12px;color:var(--text);font-size:12px;outline:none}
.ds-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.ds-card .ds-header{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text2)}
.ds-card .ds-body{display:none;margin-top:10px}
.ds-card .ds-body.open{display:block}
.ds-card .ds-key-row{display:flex;gap:6px;margin-bottom:10px}
.ds-card .ds-key-row input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 12px;color:var(--text);font-size:12px;outline:none}
.ds-card .ds-btns{display:flex;gap:6px;flex-wrap:wrap}
.ds-card .ds-btns button{flex:1;min-width:60px;padding:8px 10px;border:1px solid var(--border);border-radius:20px;background:var(--surface2);color:var(--text2);font-size:11px;cursor:pointer}
.ds-card .ds-btns button:active{border-color:var(--accent);color:var(--accent)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:68px;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:200;backdrop-filter:blur(20px)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;border:none;background:none;color:var(--text3);cursor:pointer;transition:all .2s;min-width:56px}
.nav-item.active{color:var(--accent)}.nav-item .nav-icon{font-size:20px;transition:transform .2s}
.nav-item.active .nav-icon{transform:scale(1.1)}.nav-item .nav-label{font-size:10px;font-weight:500}
.nav-item.create-tab{position:relative;top:-16px}
.nav-item.create-tab .nav-icon{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#7c5cfc,#5a3ed8);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:0 4px 16px rgba(124,92,252,.35)}
.viewer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
.viewer-overlay.active{opacity:1;pointer-events:all}
.viewer-overlay img{max-width:94vw;max-height:80vh;object-fit:contain;border-radius:8px}
.viewer-close{position:fixed;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;cursor:pointer;z-index:1001}
.viewer-download{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);padding:10px 28px;background:linear-gradient(135deg,#7c5cfc,#5a3ed8);border:none;border-radius:24px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;z-index:1001}
.viewer-nav{position:fixed;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:18px;cursor:pointer;z-index:1001;display:flex;align-items:center;justify-content:center}.viewer-nav.prev{left:10px}.viewer-nav.next{right:10px}
.toast-container{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 20px;border-radius:10px;font-size:13px;color:#fff;animation:slideIn .3s ease}.toast.error{background:var(--error)}.toast.success{background:var(--success)}.toast.info{background:var(--accent)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.settings-scroll{padding:16px;display:flex;flex-direction:column;gap:14px}
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.settings-card label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px}
.settings-card input,.settings-card select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:13px;outline:none;font-family:inherit}
.settings-card input:focus{border-color:var(--accent)}
.settings-card .key-row{display:flex;gap:6px}.settings-card .key-row input{flex:1}
.settings-card .key-row button{padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text2);cursor:pointer;font-size:13px}
.settings-card .key-link{display:inline-block;margin-top:6px;font-size:11px;color:var(--accent);text-decoration:none}
.size-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.size-btn{padding:8px 4px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text2);font-size:10px;cursor:pointer;text-align:center}
.size-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.node-row{display:flex;gap:6px}.node-btn{flex:1;padding:8px;border:1px solid var(--border);border-radius:20px;background:var(--surface2);color:var(--text2);font-size:12px;cursor:pointer;text-align:center}.node-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.failed-list{display:flex;flex-direction:column;gap:10px}.failed-item{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--error);border-radius:var(--radius-sm);padding:14px 16px}
.clear-btn{background:none;border:1px solid var(--border);border-radius:16px;padding:6px 14px;color:var(--text2);font-size:11px;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}.loading-spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s infinite;margin:0 auto}
@keyframes slideUp{from{transform:translateX(-50%) translateY(100px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
</style></head><body><div class="app">
  <div class="tab-content" id="tabContent">
    <div class="tab-panel active" id="tab-inspire">
      <div class="inspire-header">
        <h1>绘漪</h1>
        <p class="subtitle">轻落笔，涟漪生</p>
        <div class="inspire-search-row">
          <input class="inspire-search" id="searchInput" placeholder="搜索提示词...">
          <button class="clear-btn" id="clearHistory">清空</button>
        </div>
        <div class="inspire-filter-row" id="filterRow">
          <button class="filter-chip active" data-model="all">全部</button>
          <button class="filter-chip" data-model="gpt-image-2">gpt-image-2</button>
          <button class="filter-chip" data-model="gpt-image-2-vip">gpt-image-2-vip</button>
          <button class="filter-chip" data-tab="favs" id="favFilter">收藏</button>
        </div>
      </div>
      <div class="waterfall" id="historyGrid"></div>
      <div class="empty-state" id="emptyState"><p>还没有生成过图片</p></div>
    </div>
    <div class="tab-panel" id="tab-create">
      <div class="create-scroll">
        <h2>创作</h2>
        <textarea id="prompt" placeholder="描述你想生成的图片..." style="width:100%;min-height:100px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text);font-size:14px;resize:none;font-family:inherit"></textarea>
        <div style="display:flex;gap:6px;margin-top:6px">
          <input id="batchCount" type="number" value="1" min="1" max="10" style="width:50px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px;color:var(--text);text-align:center">
          <span style="font-size:12px;color:var(--text2);line-height:32px">张</span>
        </div>
        <input id="negativePrompt" placeholder="不想出现的元素..." style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;color:var(--text);font-size:12px;margin-top:6px;font-family:inherit">
        <div class="ref-grid" id="refImages"></div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button id="refUploadBtn" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:20px;background:var(--surface2);color:var(--text2);cursor:pointer">选择图片</button>
          <button id="refCameraBtn" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:20px;background:var(--surface2);color:var(--text2);cursor:pointer">拍照</button>
        </div>
        <input id="refUrlInput" placeholder="或输入图片URL" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;color:var(--text);font-size:12px;margin-top:6px;font-family:inherit">
        <button id="refUrlAdd" style="padding:6px 12px;border:1px solid var(--border);border-radius:16px;background:var(--surface2);color:var(--text2);cursor:pointer;margin-top:6px">添加URL</button>
        <input id="refInput" type="file" accept="image/*" multiple hidden>
        <div class="ds-card" style="margin-top:8px">
          <div class="ds-header" id="dsToggle">DeepSeek AI <span id="dsArrow">▶</span></div>
          <div class="ds-body" id="dsBody">
            <input id="dsApiKey" placeholder="DS API Key" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:12px;margin-top:6px;font-family:inherit">
            <div style="display:flex;gap:6px;margin-top:6px">
              <button id="dsTranslateBtn" style="flex:1;padding:6px;border:1px solid var(--border);border-radius:16px;background:var(--surface2);color:var(--text2);cursor:pointer">翻译</button>
              <button id="dsEnhanceBtn" style="flex:1;padding:6px;border:1px solid var(--border);border-radius:16px;background:var(--surface2);color:var(--text2);cursor:pointer">增强</button>
              <button id="dsAutoBtn" style="flex:1;padding:6px;border:1px solid var(--border);border-radius:16px;background:var(--surface2);color:var(--text2);cursor:pointer">自动</button>
            </div>
          </div>
        </div>
        <div id="tasksSection" style="display:none;margin-top:8px"><div class="tasks-grid" id="tasksGrid" id="tasksGrid"></div></div>
        <button id="generateBtn" style="width:100%;padding:14px;margin-top:12px;background:linear-gradient(135deg,#7c5cfc,#5a3ed8);border:none;border-radius:28px;color:#fff;font-size:15px;font-weight:700;cursor:pointer">生成图片</button>
      </div>
    </div>
    <div class="tab-panel" id="tab-settings">
      <div class="settings-scroll">
        <h2>我的</h2>
        <div class="settings-card"><label>API Key</label><input id="apiKey" type="password" placeholder="sk-..." autocomplete="off"><button id="keyToggle">显示</button></div>
        <button id="themeBtn" style="padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:var(--surface2);color:var(--text);cursor:pointer">切换主题</button>
        <div id="failedSection" style="display:none"><div class="failed-list" id="failedList"></div><button id="clearFailed">清空失败</button></div>
      </div>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="inspire"><span class="nav-icon">L</span><span>灵感</span></button>
    <button class="nav-item create-tab" data-tab="create"><span class="nav-icon">+</span><span>创作</span></button>
    <button class="nav-item" data-tab="settings"><span class="nav-icon">S</span><span>我的</span></button>
  </nav>
  <div class="viewer-overlay" id="viewer"><button class="viewer-close" id="viewerClose">X</button><img id="viewerImg"><button class="viewer-download" id="viewerDownload">下载</button></div>
  <div class="toast-container" id="toasts"></div>
</div><script>
// ============ Config ============
const BASE_URLS = { global: 'https://grsaiapi.com', china: 'https://grsai.dakka.com.cn' };
const SIZE_MAP = {
  '1:1':   { '1K': '1024x1024', '2K': '2048x2048', '4K': '2880x2880' },
  '16:9':  { '1K': '1774x887',  '2K': '2048x1152', '4K': '3840x2160' },
  '9:16':  { '1K': '887x1774',  '2K': '1152x2048', '4K': '2160x3840' },
  '3:2':   { '1K': '1536x1024', '2K': '2048x1360', '4K': '3504x2336' },
  '2:3':   { '1K': '1024x1536', '2K': '1360x2048', '4K': '2336x3504' },
  '21:9':  { '1K': '2048x880',  '2K': '3840x1648' },
  '9:21':  { '1K': '880x2048',  '2K': '1648x3840' },
  '1:3':   { '1K': '688x2048',  '2K': '1280x3840' },

const ERROR_ZH = {
  'generate failed':'生成失败','content policy violation':'内容违规','violation':'内容违规',
  'rate limit exceeded':'请求过于频繁，请稍后再试','invalid api key':'API Key 无效',
  'unauthorized':'未授权，请检查 API Key','model not found':'模型不存在',
  'invalid request':'请求参数无效','internal server error':'服务器内部错误',
  'service unavailable':'服务暂不可用','timeout':'请求超时','bad request':'请求格式错误',
  'forbidden':'访问被拒绝','not found':'资源不存在','too many requests':'请求过多，请稍后再试',
  'server error':'服务器错误','connection error':'网络连接错误','network error':'网络错误',
  'failed to generate':'生成失败','image generation failed':'图片生成失败',
  'prompt too long':'提示词过长','invalid image':'参考图片格式无效',
  'image too large':'参考图片过大','nsfw content detected':'检测到不当内容',
  'safety filter triggered':'安全过滤触发','blocked by safety system':'被安全系统拦截',
  'content filtered':'内容被过滤'
};
function translateError(msg) {
  if (!msg) return '';
  const l = msg.toLowerCase();
  if (ERROR_ZH[l]) return ERROR_ZH[l];
  let best='', tr='';
  for (const [k,v] of Object.entries(ERROR_ZH)) { if (l.includes(k) && k.length>best.length) { best=k; tr=v; } }
  return tr || msg;
}

// ============ API ============
function getBaseUrl(){return BASE_URLS[state.node];}
function getHeaders(){return{'Content-Type':'application/json','Authorization':`Bearer ${apiKeyInput.value.trim()}`};}
async function submitGeneration(prompt,images){
  const body={model:state.model,prompt,aspectRatio:state.selectedSize,replyType:'async'};
  if(images&&images.length>0) body.images=images;
  const resp=await fetch(`${getBaseUrl()}/v1/api/generate`,{method:'POST',headers:getHeaders(),body:JSON.stringify(body)});
  if(!resp.ok){
    try{
      const errData=await resp.json();
      if(errData.status==='violation') throw new Error('内容违规，请修改提示词');
      if(errData.status==='failed') throw new Error(errData.error||'生成失败');
      throw new Error(errData.error||`HTTP ${resp.status}`);
    }catch(jsonErr){
      if(jsonErr.message&&jsonErr.message!=='Unexpected token') throw jsonErr;
      const t=await resp.text();throw new Error(`HTTP ${resp.status}: ${t}`);
    }
  }
  return resp.json();
}
async function pollResult(taskId){
  const resp=await fetch(`${getBaseUrl()}/v1/api/result?id=${encodeURIComponent(taskId)}`,{headers:getHeaders()});
  if(!resp.ok) throw new Error(`Poll HTTP ${resp.status}`);
  return resp.json();
}

// ============ Tasks ============
function addTask(taskId,prompt){
  state.tasks.unshift({id:taskId,prompt,model:state.model,size:state.selectedSize,status:'running',progress:0,results:[],error:null,createdAt:Date.now()});
  renderTasks();startPolling(taskId);
}
function updateTask(taskId,data){
  const task=state.tasks.find(t=>t.id===taskId);if(!task)return;
  Object.assign(task,data);renderTasks();
  if(task.status==='succeeded'){
    stopPolling(taskId);
    if(task.results&&task.results.length>0){
      task.results.forEach(r=>{state.history.unshift({url:r.url,prompt:task.prompt,model:task.model,size:task.size,timestamp:task.createdAt,id:Date.now()+'_'+Math.random().toString(36).slice(2,8)});});
      saveHistory();renderHistory();
    }
    setTimeout(()=>removeTask(taskId),2000);
    showToast('图片生成成功！','success');
  }else if(task.status==='failed'||task.status==='violation'){
    stopPolling(taskId);
    // Add to failed records instead of auto-removing
    state.failedRecords.unshift({prompt:task.prompt,model:task.model,size:task.size,error:task.error,status:task.status,timestamp:Date.now(),id:task.id});
    saveFailed();renderFailed();
    showToast(`生成失败: ${translateError(task.error)}`,'error');
    setTimeout(()=>removeTask(taskId),3000);
  }
}
function removeTask(taskId){state.tasks=state.tasks.filter(t=>t.id!==taskId);renderTasks();}
function startPolling(taskId){
  if(state.pollingTimers[taskId])return;
  state.pollingTimers[taskId]=setInterval(async()=>{
    try{const d=await pollResult(taskId);updateTask(taskId,{status:d.status,progress:d.progress||0,results:d.results||[],error:d.error||null});}
    catch(e){console.error('Poll error:',e);}
  },POLL_INTERVAL);
}
function stopPolling(taskId){if(state.pollingTimers[taskId]){clearInterval(state.pollingTimers[taskId]);delete state.pollingTimers[taskId];}}
function escapeHtml(str){const d=document.createElement('div');d.textContent=str;return d.innerHTML;}

function renderTasks(){
  const active=state.tasks.filter(t=>t.status==='running');
  if(active.length===0&&state.tasks.length===0){tasksSection.style.display='none';return;}
  tasksSection.style.display='block';taskCount.textContent=active.length;
  tasksGrid.innerHTML=state.tasks.map(task=>{
    const sc=task.status;
    const st={running:'生成中...',succeeded:'完成',failed:'生成失败',violation:'内容违规'}[task.status]||translateError(task.status);
    let imgC='';
    const imgUrl = (task.results&&task.results.length>0&&task.results[0].url) ? task.results[0].url : "";
    if(imgUrl){imgC=`<img src="${imgUrl}" alt="生成结果" loading="lazy" data-action="view" data-url="${encodeURIComponent(imgUrl)}">`;}
    else imgC=`<div style="color:var(--text2);font-size:28px">🎨</div>`;
    const errH=task.error?`<div style="font-size:11px;color:var(--error);margin-top:6px">❌ ${escapeHtml(translateError(task.error))}</div>`:'';
    const actH=(task.status==='succeeded'&&imgUrl)?`<div class="card-actions"><button data-action="download" data-url="${encodeURIComponent(imgUrl)}">⬇ 下载</button><button data-action="view" data-url="${encodeURIComponent(imgUrl)}">🔍 查看</button></div>`:'';
    return`<div class="task-card ${sc}"><div class="card-img">${imgC}</div><div class="card-body"><div class="card-prompt">${escapeHtml(task.prompt)}</div>${task.status==='running'?`<div class="progress-bar"><div class="fill" style="width:${task.progress}%"></div></div>`:''}<div class="card-meta"><span class="status-badge ${sc}"><span class="dot"></span>${st}${task.status==='running'&&task.progress?' '+task.progress+'%':''}</span><span class="model-tag">${task.model}</span></div>${actH}${errH}</div></div>`;
  }).join('');
}

// ============ Enhance ============
function enhancePrompt(){
  const p=promptArea.value.trim();if(!p){showToast('请先输入提示词','error');return;}
  // Smart enhancement: add detail keywords based on existing prompt
  const enhancements=[
    {check:['人','女孩','woman','girl','boy','man','角色'],add:'highly detailed face, beautiful eyes, sharp focus, '},
    {check:['景','风景','landscape','山','海','天空','sunset','sunrise'],add:'golden hour lighting, atmospheric perspective, vivid colors, '},
    {check:['动物','cat','dog','猫咪','小狗','pet'],add:'fluffy fur texture, expressive eyes, natural pose, '},
    {check:['建筑','building','城市','city','street'],add:'architectural details, dramatic perspective, urban atmosphere, '},
    {check:['食物','food','cake','pizza','sushi'],add:'appetizing presentation, food photography, shallow depth of field, '},
  ];
  let suffix='';
  const pl=p.toLowerCase();
  for(const e of enhancements){if(e.check.some(k=>pl.includes(k))){suffix+=e.add;break;}}
  // Check if prompt already has quality boosters
  const hasQuality=/(ultra detailed|high quality|masterpiece|8k|4k|high resolution)/i.test(p);
  if(!hasQuality) suffix+='ultra detailed, high quality, 8K resolution, ';
  if(suffix){
    // Remove trailing comma+space
    suffix=suffix.replace(/,\s*$/,'');
    promptArea.value=p+', '+suffix;
    updateCharCount();
    showToast('提示词已增强 ✓','success');
  }else{
    promptArea.value=p+', ultra detailed, high quality, 8K resolution, professional';
    updateCharCount();
    showToast('提示词已增强 ✓','success');
  }
}

// ============ Actions ============
async function handleGenerate(){
  let prompt=promptArea.value.trim();
  if(!prompt){showToast('请输入提示词','error');return;}
  if(!apiKeyInput.value.trim()){showToast('请输入 API Key','error');return;}
  // Append negative prompt
  const neg=$('negativePrompt').value.trim();
  if(neg) prompt+=' 不要包含：'+neg;
  const count=Math.min(Math.max(parseInt(batchCount.value)||1,1),10);
  generateBtn.disabled=true;generateBtn.textContent=`⏳ 提交${count>1?count+'个任务':'中'}...`;
  let submitted=0;
  try {
    for(let i=0;i<count;i++){
      try {
        // 批量生成时为每张图添加变体标识
        const variedPrompt = count > 1 ? prompt + ` [variation ${i + 1}]` : prompt;
        const data=await submitGeneration(variedPrompt,state.refImages);
      if(data.id){addTask(data.id,prompt);submitted++;}
      else if(data.status==='succeeded'&&data.results){
        data.results.forEach(r=>{state.history.unshift({url:r.url,prompt,model:state.model,size:state.selectedSize,timestamp:Date.now(),id:Date.now()+'_'+Math.random().toString(36).slice(2,8)});});
        submitted++;
      }else if(data.status==='failed'||data.status==='violation'){
        showToast(`第${i+1}张失败: ${translateError(data.error||'')}`,'error');
      }
    }catch(e){logError(e.message||String(e),'handleGenerate',e.stack);showToast(`第${i+1}张请求失败: ${translateError(e.message)}`,'error');}
  }
    if(submitted>0){saveHistory();renderHistory();showToast(`已提交 ${submitted} 个任务`,'info');}
  } finally {
    generateBtn.disabled=false;generateBtn.textContent='🎨 生成图片';
  }
}

async function downloadImage(url,btnEl){
  if(btnEl){btnEl.classList.add('downloading');btnEl.textContent='⏳ 下载中...';}
  try{
    const resp=await fetch(url);if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
    const blob=await resp.blob();
    const ct=blob.type||'';let ext='png';
    if(ct.includes('jpeg')||ct.includes('jpg'))ext='jpg';else if(ct.includes('webp'))ext='webp';else if(ct.includes('gif'))ext='gif';
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`gpt-image2-${Date.now()}.${ext}`;a.click();URL.revokeObjectURL(a.href);
    showToast('图片已开始下载','success');
  }catch(e){
    // 跨域降级：直接在新标签页打开
    const a=document.createElement('a');
    a.href=url;a.target='_blank';a.download=`gpt-image2-${Date.now()}.png`;
    a.click();
    showToast('已在新标签页打开，请右键保存图片','info');
  }
  finally{if(btnEl){btnEl.classList.remove('downloading');btnEl.textContent='⬇ 下载';}}
}

// ============ Event Bindings ============
function bindEvents(){
  // Generate
  generateBtn.addEventListener('click',handleGenerate);
  enhanceBtn.addEventListener('click',enhancePrompt);
  promptArea.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&!generateBtn.disabled){e.preventDefault();handleGenerate();}});
  promptArea.addEventListener('input',()=>{updateCharCount();promptArea.style.height='auto';promptArea.style.height=promptArea.scrollHeight+'px';});


  // API key
  keyToggle.addEventListener('click',()=>{const isP=apiKeyInput.type==='password';apiKeyInput.type=isP?'text':'password';keyToggle.textContent=isP?'🔒':'👁';});
  apiKeyInput.addEventListener('input',saveSettings);

  // Node
  document.querySelectorAll('.node-btn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.node-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');state.node=btn.dataset.node;saveSettings();});});

  // Model
  modelSelect.addEventListener('change',()=>{
    state.model=modelSelect.value;
    if(state.model!=='gpt-image-2-vip'&&state.selectedQuality!=='1K')state.selectedQuality='1K';
    const vipHint=$('sizeVipHint');if(vipHint)vipHint.classList.toggle('show',state.model!=='gpt-image-2-vip');
    if(SIZE_MAP[state.selectedRatio]&&SIZE_MAP[state.selectedRatio][state.selectedQuality])state.selectedSize=SIZE_MAP[state.selectedRatio][state.selectedQuality];
    renderSizeGrid();saveSettings();
  });

  // Size
  sizeGrid.addEventListener('click',e=>{const btn=e.target.closest('.size-btn');if(!btn)return;state.selectedRatio=btn.dataset.ratio;state.selectedQuality=btn.dataset.quality;state.selectedSize=btn.dataset.px;renderSizeGrid();saveSettings();});

  // Reference images - click
  refImagesDiv.addEventListener('click',async e=>{
    if(e.target.closest('.remove-btn')){e.stopPropagation();state.refImages.splice(parseInt(e.target.closest('.remove-btn').dataset.index),1);renderRefImages();return;}
    const slot=e.target.closest('.ref-img-slot');if(slot&&slot.dataset.index==='add')refInput.click();
  });
  $('refUrlAdd').addEventListener('click',()=>{const inp=$('refUrlInput');const url=inp.value.trim();if(url){addRefImageFromUrl(url);inp.value='';}});
refInput.addEventListener('change',()=>{addRefImagesFromFiles(refInput.files);refInput.value='';});
  const refUploadBtn=document.getElementById('refUploadBtn');if(refUploadBtn){refUploadBtn.addEventListener('click',()=>{if(/iPhone|iPad|Android/i.test(navigator.userAgent)){refInput.setAttribute('capture','environment');}refInput.click();});}

  // Drag & drop on ref zone
  ['dragenter','dragover'].forEach(ev=>{refDropZone.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();refDropZone.classList.add('active');});});
  ['dragleave','drop'].forEach(ev=>{refDropZone.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();refDropZone.classList.remove('active');});});
  refDropZone.addEventListener('drop',e=>{const files=e.dataTransfer.files;if(files.length)addRefImagesFromFiles(files);});
  // Also allow drop on ref images area
  ['dragenter','dragover'].forEach(ev=>{refImagesDiv.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();refDropZone.classList.add('active');});});
  ['dragleave','drop'].forEach(ev=>{refImagesDiv.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();refDropZone.classList.remove('active');});});
  refImagesDiv.addEventListener('drop',e=>{const files=e.dataTransfer.files;if(files.length)addRefImagesFromFiles(files);});

  // Paste (clipboard) - listen on whole document
  document.addEventListener('paste',e=>{
    const items=e.clipboardData?.items;
    if(!items)return;
    for(const item of items){
      if(item.type.startsWith('image/')){
        e.preventDefault();
        const blob=item.getAsFile();
        if(blob)addRefImageFromBlob(blob);
        return;
      }
    }
  });

  // Viewer
  viewer.addEventListener('click',e=>{if(e.target===viewer||e.target===viewerClose)closeViewer();});
  viewerClose.addEventListener('click',closeViewer);
  viewerPrev.addEventListener('click',e=>{e.stopPropagation();viewerNavDir(-1);});
  viewerNext.addEventListener('click',e=>{e.stopPropagation();viewerNavDir(1);});
  viewerDownload.addEventListener('click',async e=>{e.stopPropagation();if(state.currentViewerUrl)await downloadImage(state.currentViewerUrl,null);});

  // History tabs
  document.querySelectorAll('.history-tab').forEach(tab=>{
    tab.addEventListener('click',()=>{document.querySelectorAll('.history-tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');state.activeTab=tab.dataset.tab;renderHistory();});
  });

  // Search (防抖)
  let searchTimer;
  searchInput.addEventListener('input',()=>{
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{state.searchQuery=searchInput.value.trim();renderHistory();},300);
  });

  // Filter chips (model)
  document.querySelectorAll('.filter-chip[data-model]').forEach(chip=>{
    chip.addEventListener('click',()=>{
      document.querySelectorAll('.filter-chip[data-model]').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');state.filterModel=chip.dataset.model;renderHistory();
    });
  });

  // ============ 统一事件委托 (替代行内 onclick) ============
  // 处理生成中任务卡片
  tasksGrid.addEventListener('click',e=>{
    const btn=e.target.closest('[data-action]');
    if(!btn)return;
    const action=btn.dataset.action;
    const url=decodeURIComponent(btn.dataset.url||'');
    if(action==='view'&&url)viewImage(url);
    if(action==='download'&&url)downloadImage(url,btn);
  });

  // 处理历史记录卡片 (收藏、查看、下载、重用)
  historyGrid.addEventListener('click',e=>{
    // 收藏按钮
    const favBtn=e.target.closest('.card-fav');
    if(favBtn){e.stopPropagation();toggleFavorite(favBtn.dataset.id);return;}
    // 查看图片
    const imgEl=e.target.closest('[data-action="view-history"]');
    if(imgEl){const idx=parseInt(imgEl.dataset.idx);if(!isNaN(idx))viewImageList(idx);return;}
    // 下载 & 重用
    const btn=e.target.closest('[data-action]');
    if(btn){
      const action=btn.dataset.action;
      if(action==='download'){const url=decodeURIComponent(btn.dataset.url||'');if(url)downloadImage(url,btn);return;}
      if(action==='reuse'){const idx=parseInt(btn.dataset.idx);if(!isNaN(idx))reusePrompt(idx);return;}
    }
  });

  // Clear history
  clearHistoryBtn.addEventListener('click',()=>{
    if(state.history.length===0)return;
    if(confirm('确定要清空所有历史记录吗？')){state.history=[];state.favorites.clear();saveHistory();saveSettings();renderHistory();showToast('历史已清空','info');}
  });

  // Failed records events
  $('clearFailed').addEventListener('click',()=>{
    if(state.failedRecords.length===0)return;
    if(confirm('确定要清空所有失败记录吗？')){state.failedRecords=[];saveFailed();renderFailed();showToast('失败记录已清空','info');}
  });
  $('failedList').addEventListener('click',e=>{
    const removeBtn=e.target.closest('.failed-remove');
    if(removeBtn){state.failedRecords.splice(parseInt(removeBtn.dataset.idx),1);saveFailed();renderFailed();return;}
    const retryBtn=e.target.closest('.retry-btn');
    if(retryBtn){const rec=state.failedRecords[parseInt(retryBtn.dataset.idx)];if(rec){promptArea.value=rec.prompt;updateCharCount();handleGenerate();}return;}
    const reuseBtn=e.target.closest('.reuse-prompt-btn');
    if(reuseBtn){const rec=state.failedRecords[parseInt(reuseBtn.dataset.idx)];if(rec){promptArea.value=rec.prompt;updateCharCount();promptArea.focus();showToast('已填入提示词','info');}return;}
    const polishBtn=e.target.closest('.polish-btn');
    if(polishBtn){dsPolishPrompt(parseInt(polishBtn.dataset.idx));return;}
  });

  // DeepSeek toggle
  $('dsToggle').addEventListener('click',()=>{
    const body=$('dsBody'),arrow=$('dsArrow');
    body.classList.toggle('open');arrow.classList.toggle('open');
  });
  $('dsKeyToggle').addEventListener('click',()=>{
    const inp=$('dsApiKey');
    inp.type=inp.type==='password'?'text':'password';
  });
  // Load/save DeepSeek key
  const savedDsKey=localStorage.getItem('gis2_dskey');
  if(savedDsKey) $('dsApiKey').value=savedDsKey;
  $('dsApiKey').addEventListener('input',()=>{localStorage.setItem('gis2_dskey',$('dsApiKey').value);});

  // DeepSeek buttons
  $('dsTranslateBtn').addEventListener('click',dsTranslate);
  $('dsEnhanceBtn').addEventListener('click',dsEnhance);
  $('dsAutoBtn').addEventListener('click',dsAutoGenerate);

  // Negative prompt - auto-resize textarea
  const negTa=$('negativePrompt');
  function autoResizeNeg(){
    negTa.style.height='auto';
    negTa.style.height=Math.min(negTa.scrollHeight,160)+'px';
  }
  negTa.addEventListener('input',autoResizeNeg);
  autoResizeNeg(); // init

  // Negative presets panel toggle
  $('negPresetsBtn').addEventListener('click',e=>{
    e.stopPropagation();
    const panel=$('negPresetsPanel');
    const btn=$('negPresetsBtn');
    panel.classList.toggle('open');
    btn.classList.toggle('open');
    btn.textContent=panel.classList.contains('open')?'✕ 关闭':'▾ 预设';
  });

  // Negative presets - chip selection
  $('negPresetsPanel').addEventListener('click',e=>{
    const chip=e.target.closest('.neg-chip');
    if(chip){chip.classList.toggle('selected');updateNegApplyBtn();return;}
    if(e.target.id==='negClearBtn'){
      negTa.value='';
      autoResizeNeg();
      document.querySelectorAll('.neg-chip').forEach(c=>c.classList.remove('selected'));
      updateNegApplyBtn();
      return;
    }
    if(e.target.id==='negApplyBtn'){
      const selected=Array.from(document.querySelectorAll('.neg-chip.selected')).map(c=>c.dataset.neg);
      if(!selected.length)return;
      const newNeg=selected.join(', ');
      if(negTa.value.trim()){
        // Append with comma
        negTa.value=(negTa.value.trim().replace(/,+\s*$/,''))+', '+newNeg;
      }else{
        negTa.value=newNeg;
      }
      autoResizeNeg();
      document.querySelectorAll('.neg-chip').forEach(c=>c.classList.remove('selected'));
      $('negPresetsPanel').classList.remove('open');
      $('negPresetsBtn').classList.remove('open');
      $('negPresetsBtn').textContent='▾ 预设';
      showToast('已添加 '+selected.length+' 个预设','success');
    }
  });

  function updateNegApplyBtn(){
    const count=document.querySelectorAll('.neg-chip.selected').length;
    const btn=$('negApplyBtn');
    btn.textContent=count>0?'应用 ×'+count:'应用 ×';
    btn.disabled=count===0;
  }
  updateNegApplyBtn();

  // ============ 全局键盘快捷键 ============
  document.addEventListener('keydown',e=>{
    // Ctrl+G 生成
    if((e.metaKey||e.ctrlKey)&&e.key==='g'&&!generateBtn.disabled){e.preventDefault();handleGenerate();}
    // Esc 关闭查看器
    if(e.key==='Escape'){if(viewer.classList.contains('active'))closeViewer();}
    // 查看器中左右导航
    if(viewer.classList.contains('active')){
      if(e.key==='ArrowLeft')viewerNavDir(-1);
      if(e.key==='ArrowRight')viewerNavDir(1);
    }
  });

  // ============ 页面卸载清理 (防内存泄漏) ============
  window.addEventListener('beforeunload',()=>{
    Object.values(state.pollingTimers).forEach(clearInterval);
    state.pollingTimers={};
  });

  // 页面隐藏时暂停轮询，重新可见时恢复
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){
      Object.values(state.pollingTimers).forEach(clearInterval);
    }else{
      state.tasks.filter(t=>t.status==='running').forEach(t=>startPolling(t.id));
    }
  });

  // Close presets when clicking outside
  document.addEventListener('click',e=>{
    const panel=$('negPresetsPanel');
    const btn=$('negPresetsBtn');
    if(panel.classList.contains('open')&&!panel.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
      panel.classList.remove('open');
      btn.classList.remove('open');
      btn.textContent='▾ 预设';
    }
  });

}

// ============ DeepSeek API ============
async function dsCall(messages,showLoading=true){
  const dsKey=$('dsApiKey').value.trim();
  if(!dsKey){showToast('请先输入 DeepSeek API Key','error');return null;}
  const btns=['dsTranslateBtn','dsEnhanceBtn','dsAutoBtn'];
  if(showLoading) btns.forEach(id=>{const b=$(id);if(b)b.disabled=true;});
  try{
    const r=await fetch(DS_BASE_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+dsKey},
      body:JSON.stringify({model:'deepseek-chat',messages,max_tokens:2048,temperature:0.7})
    });
    const d=await r.json();
    if(d.error){showToast('DeepSeek: '+d.error.message,'error');return null;}
    return d.choices[0].message.content.trim();
  }catch(e){showToast('DeepSeek 请求失败: '+e.message,'error');return null;}
  finally{if(showLoading) btns.forEach(id=>{const b=$(id);if(b)b.disabled=false;});}
}

async function dsTranslate(){
  const txt=promptArea.value.trim();
  if(!txt){showToast('请先输入提示词','error');return;}
  showToast('正在翻译...','info');
  const result=await dsCall([
    {role:'system',content:'You are a professional AI image prompt translator. Translate the following Chinese text into an optimized English prompt for GPT-Image-2. Output ONLY the English prompt, no explanation.'},
    {role:'user',content:txt}
  ]);
  if(result){promptArea.value=result;updateCharCount();showToast('翻译完成！','success');}
}

async function dsEnhance(){
  const txt=promptArea.value.trim();
  if(!txt){showToast('请先输入提示词','error');return;}
  showToast('正在增强提示词...','info');
  const result=await dsCall([
    {role:'system',content:'You are an expert AI image prompt engineer. Enhance and expand the following prompt to create more detailed, visually stunning images. Add specific details about lighting, composition, style, color, and quality. Output ONLY the enhanced English prompt, no explanation.'},
    {role:'user',content:txt}
  ]);
  if(result){promptArea.value=result;updateCharCount();showToast('增强完成！','success');}
}

async function dsAutoGenerate(){
  const txt=promptArea.value.trim();
  if(!txt){showToast('请先输入简短描述','error');return;}
  showToast('正在生成完整提示词...','info');
  const result=await dsCall([
    {role:'system',content:'You are an expert AI image prompt engineer. The user will give you a short description or idea. Generate a complete, detailed, professional English prompt for GPT-Image-2. Include specific visual details: subject, style, lighting, composition, color palette, and quality keywords. Output ONLY the prompt, no explanation.'},
    {role:'user',content:txt}
  ]);
  if(result){promptArea.value=result;updateCharCount();showToast('提示词生成完成！','success');}
}

async function dsPolishPrompt(idx){
  const rec=state.failedRecords[idx];
  if(!rec){return;}
  const dsKey=$('dsApiKey').value.trim();
  if(!dsKey){showToast('润色需要 DeepSeek API Key，请先填写','error');return;}
  const polishBtn=document.querySelector(`.polish-btn[data-idx="${idx}"]`);
  if(polishBtn) polishBtn.disabled=true;
  showToast('正在润色提示词...','info');
  try{
    const r=await fetch(DS_BASE_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+dsKey},
      body:JSON.stringify({model:'deepseek-chat',messages:[
        {role:'system',content:'You are an expert at rewriting AI image generation prompts to comply with content policies while preserving the original creative intent. The user\'s prompt was flagged for a content policy violation. Rewrite it to: 1) Remove or rephrase any potentially problematic content 2) Use safe, artistic alternatives (e.g., "revealing" → "elegant", "nude" → "artistic figure study", "violent" → "dramatic") 3) Keep the same visual concept, composition, and style 4) Make it more descriptive with safe, detailed visual language Output ONLY the rewritten English prompt, no explanation, no notes.'},
        {role:'user',content:'Original prompt that was flagged:\n'+rec.prompt+'\n\nError message: '+rec.error}
      ],max_tokens:2048,temperature:0.7})
    });
    const d=await r.json();
    if(d.error){showToast('DeepSeek: '+d.error.message,'error');return;}
    const result=d.choices[0].message.content.trim();
    if(result){
      promptArea.value=result;
      updateCharCount();
      promptArea.focus();
      showToast('润色完成，已填入提示词！','success');
    }
  }catch(e){showToast('润色请求失败: '+e.message,'error');}
  finally{if(polishBtn) polishBtn.disabled=false;}
}

// ============ Start ============
init();

      animation:slideUp .4s ease;white-space:nowrap;
    `;
    installBanner.textContent = '📲 添加到主屏幕，随时使用';
    installBanner.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const result = await deferredPrompt.userChoice;

        installBanner.remove();
      }

});
